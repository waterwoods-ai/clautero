<linkset>
  <html:link rel="localization" href="addon.ftl" xmlns:html="http://www.w3.org/1999/xhtml"/>
</linkset>

<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <groupbox>
    <label><html:h2>Clautero</html:h2></label>

    <hbox align="center">
      <label value="Claude CLI Path:" />
      <html:input type="text" id="clautero-prefs-cli-path"
                  preference="extensions.clautero.claudeCliPath"
                  placeholder="/path/to/claude"
                  style="flex: 1; font-family: monospace;" />
    </hbox>
    <description style="font-size: 11px; color: #666; margin: 4px 0 12px 0;">
      Full path to the Claude CLI binary. Run "which claude" in terminal to find it.
    </description>

    <hbox align="center" style="margin-top: 8px;">
      <label value="Workspace Directory:" />
      <html:input type="text" id="clautero-prefs-workspace"
                  preference="extensions.clautero.workspaceDir"
                  placeholder="(default: Zotero data dir/clautero/workspace)"
                  style="flex: 1; font-family: monospace;" />
    </hbox>
    <description style="font-size: 11px; color: #666; margin: 4px 0 12px 0;">
      Working directory for Claude. Leave empty to use default. Claude can read/write files here.
    </description>

    <hbox align="center" style="margin-top: 8px;">
      <label value="Permission Mode:" />
      <html:select id="clautero-prefs-permission-mode"
                   preference="extensions.clautero.permissionMode"
                   style="margin-left: 8px;">
        <html:option value="acceptEdits">Accept Edits (default)</html:option>
        <html:option value="plan">Plan Mode (read-only)</html:option>
        <html:option value="bypassPermissions">Bypass All (YOLO)</html:option>
      </html:select>
    </hbox>
    <description style="font-size: 11px; color: #666; margin: 4px 0 12px 0;">
      Controls what Claude can do. "Accept Edits" auto-approves file edits. "Bypass All" skips all permission checks.
    </description>

    <checkbox id="clautero-prefs-auto-attach"
              label="Auto-attach selected item/collection as context"
              preference="extensions.clautero.autoAttachContext" />

    <hbox align="center" style="margin-top: 8px;">
      <label value="Max context length (chars):" />
      <html:input type="number" id="clautero-prefs-max-context"
                  preference="extensions.clautero.maxContextLength"
                  min="1000" max="200000"
                  style="width: 80px;" />
    </hbox>
  </groupbox>
</vbox>
